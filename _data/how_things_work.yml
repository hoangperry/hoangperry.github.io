- id: c-41
  number: "01"
  url: /how-things-work/c-41/
  title: "Máy tráng phim C‑41 hoạt động thế nào?"
  subjects: "Nhiếp ảnh · Máy móc"
  summary: "Đi cùng một cuộn phim màu qua máy tráng: vì sao phải kín sáng, thuốc hiện tạo ra màu thế nào, tẩy bạc và định hình làm gì, rồi tự thử trên chính cỗ máy đó."
  thumbnail: /assets/how-things-work/c-41/thumbnail.webp
- id: drum-scanner
  number: "02"
  url: /how-things-work/drum-scanner/
  title: "Máy scan trống biến phim thành ảnh số thế nào?"
  subjects: "Nhiếp ảnh · Máy móc"
  summary: "Theo ánh sáng xuyên phim qua ba ống nhân quang và bộ đổi số: vì sao trống phải quay, từng điểm ảnh được ghi thế nào và âm bản cần diễn giải ra sao."
  thumbnail: /assets/how-things-work/drum-scanner/thumbnail.webp
- id: bw-enlarger
  number: "03"
  url: /how-things-work/bw-enlarger/
  title: "Máy phóng biến âm bản thành ảnh trên giấy thế nào?"
  subjects: "Nhiếp ảnh · Máy móc"
  summary: "Theo ánh sáng từ bóng đèn qua gương, tụ quang, âm bản và ống kính xuống giấy: nâng đầu để đổi độ phóng, lấy nét, phơi rồi vì sao tắt đèn vẫn chưa thấy ảnh."
  thumbnail: /assets/how-things-work/bw-enlarger/thumbnail.webp
- id: slr-film-camera
  number: "04"
  url: /how-things-work/slr-film-camera/
  title: "Máy ảnh SLR dùng cùng một ống kính để ngắm và chụp thế nào?"
  subjects: "Nhiếp ảnh · Máy móc"
  summary: "Theo ánh sáng qua gương, khẩu và hai rèm tới phim: vì sao kính ngắm tối đi lúc chụp, mỗi điểm phim nhận sáng thế nào và khi nào mới được lên khung kế."
  thumbnail: /assets/how-things-work/slr-film-camera/thumbnail.webp
- id: swing-lens-panorama
  number: "05"
  url: /how-things-work/swing-lens-panorama/
  title: "Máy ảnh panorama quét cảnh lên cuộn phim đứng yên thế nào?"
  subjects: "Nhiếp ảnh · Máy móc"
  summary: "Theo ống kính quay và khe hẹp qua mặt phim cong: vì sao từng dải ảnh được ghi ở thời điểm khác nhau, khe phải đóng trước khi hồi và phim chỉ dịch khi lên cò."
  thumbnail: /assets/how-things-work/swing-lens-panorama/thumbnail.webp
- id: instant-film-camera
  number: "06"
  url: /how-things-work/instant-film-camera/
  title: "Máy ảnh lấy liền đưa tấm phim qua con lăn để hiện ảnh thế nào?"
  subjects: "Nhiếp ảnh · Máy móc"
  summary: "Theo tấm phim từ lúc nhận sáng, được ngón đẩy đưa vào hai con lăn, trải thuốc hiện rồi ra khe: vì sao ảnh vẫn tiếp tục hiện sau khi ra khỏi máy."
  thumbnail: /assets/how-things-work/instant-film-camera/thumbnail.webp
- id: slide-projector
  number: "07"
  url: /how-things-work/slide-projector/
  title: "Máy chiếu slide đổi dương bản trong khay tròn thế nào?"
  subjects: "Nhiếp ảnh · Máy móc"
  summary: "Theo khay tròn, bàn nâng, ngón ép và hai lá chắn sáng: vì sao màn phải tối khi đổi dương bản, khay chỉ quay khi slide đã trở về và ảnh chỉ sáng khi slide mới tựa đúng cửa chiếu."
  thumbnail: /assets/how-things-work/slide-projector/thumbnail.webp
- id: stepper-motor
  number: "08"
  url: /how-things-work/stepper-motor/
  title: "Động cơ bước quay từng nấc thế nào?"
  subjects: "Điện tử · Máy móc"
  summary: "Tự cấp điện cho từng cuộn dây và nhìn nam châm bị hút theo: vì sao trục nhích đúng một nấc rồi đứng yên, đảo thứ tự thì đổi chiều, và vì sao bước quá nhanh thì động cơ trượt bước mà bộ điều khiển không hay biết."
  thumbnail: /assets/how-things-work/stepper-motor/thumbnail.webp
- id: barometric-altimeter
  number: "09"
  url: /how-things-work/barometric-altimeter/
  title: "Đồng hồ đo độ cao quay kim bằng cách nào?"
  subjects: "Khí áp · Máy móc"
  summary: "Theo áp suất tĩnh tác động lên hộp màng đàn hồi, qua đòn và bánh răng tới kim: vì sao lên cao, đổi thời tiết hay vặn chuẩn đều có thể làm số chỉ thay đổi."
  thumbnail: /assets/how-things-work/barometric-altimeter/thumbnail.webp
- id: hard-disk-drive
  number: "10"
  url: /how-things-work/hard-disk-drive/
  title: "Ổ cứng HDD tìm và đọc một sector bằng cách nào?"
  subjects: "Lưu trữ · Máy móc"
  summary: "Theo đầu đọc tìm track trong lúc platter vẫn quay, chờ sector tới rồi đọc khi cả ô đi qua: vì sao cùng một yêu cầu có thể chờ gần như không mất thời gian hoặc gần trọn một vòng."
  thumbnail: /assets/how-things-work/hard-disk-drive/thumbnail.webp
- id: open-differential
  number: "11"
  url: /how-things-work/open-differential/
  title: "Bộ vi sai giúp hai bánh xe quay khác tốc độ thế nào?"
  subjects: "Ô tô · Máy móc"
  summary: "Theo vỏ vi sai, hai bánh răng bán trục và bánh răng hành tinh: vì sao vào cua hai bánh quay khác tốc độ mà trung bình vẫn bằng tốc độ vỏ, và vì sao theo giả thiết lý tưởng bánh ít bám đặt trần mô-men cho cả cầu."
  thumbnail: /assets/how-things-work/open-differential/thumbnail.webp
- id: ac-generator
  number: "12"
  url: /how-things-work/ac-generator/
  title: "Máy phát điện xoay chiều tạo ra điện áp thế nào?"
  subjects: "Điện từ · Máy móc"
  summary: "Theo cuộn dây quay và hai đồ thị từ thông, điện áp: vì sao từ thông cực đại thì điện áp bằng 0, quay nhanh làm đỉnh cao hơn, và dừng trục khác với tạm dừng mô phỏng."
  thumbnail: /assets/how-things-work/ac-generator/thumbnail.webp
- id: euv-lithography
  number: "13"
  url: /how-things-work/euv-lithography/
  title: "Bên trong máy quang khắc EUV: từ giọt thiếc đến một lớp mạch"
  subjects: "Bán dẫn · Quang học"
  summary: "Đi theo ánh sáng từ plasma thiếc qua gương, mặt nạ và khe quét. Thử đổi chu kỳ vạch, lệch tiêu và sai nhịp hai bàn để thấy khi nào mẫu mất nét, khi nào in lệch lớp cũ."
  thumbnail: /assets/how-things-work/euv-lithography/thumbnail.webp
- id: mosfet
  number: "14"
  url: /how-things-work/mosfet/
  title: "MOSFET: Vì sao cổng cách điện vẫn bật được dòng điện?"
  subjects: "Bán dẫn · Điện tử"
  summary: "Thử hai điện áp trên bản cắt NMOS: vì sao có kênh chưa chắc có dòng, và vì sao dòng máng vẫn chạy khi kênh thắt và đi vào bão hòa."
  thumbnail: /assets/how-things-work/mosfet/thumbnail.webp
