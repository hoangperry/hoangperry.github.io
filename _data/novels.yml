- slug: vet-nang-tren-them-cua
  title: Vệt Nắng Trên Thềm Cửa
  chapters: 64
  tagline: Hiện thực đời thường. Một kiếp chó cỏ trên bậc thềm xóm nghèo.
  synopsis: |
    Mi là chó cỏ vàng, nhìn thế giới ngang đầu gối. Từ sọt tre góc chợ huyện, chú được cậu út bế về căn nhà xiêu vẹo, nằm trong vệt nắng chiều trên bậc thềm xi măng nứt.

    Rồi nợ nần, rượu, và những đôi chân lần lượt bước qua cổng rỉ sét. Mi không hiểu cơm áo. Chú chỉ giữ mùi người thân, giữ bậc thềm, và chờ một bước chân quen trở lại.

    Văn hiện thực, góc nhìn loài vật, không phép màu. Có bản nghe 50 chương; phần sau đang cập nhật.
  status: Đang cập nhật
