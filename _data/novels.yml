  tagline: Crime thriller. Giám định viên bảo hiểm, điều khoản mạng sống.
  synopsis: |
    Trịnh Bách là giám định viên tổn thất của một tập đoàn bảo hiểm nhân thọ ở Sài Gòn — và là sát thủ ngầm biến án mạng thành tai nạn hoàn hảo. Anh tự cho đó là công lý khi pháp luật đã tha.

    Rồi một kẻ giấu mặt, xưng Kẻ Ký Phát, nắm toàn bộ hồ sơ đen của anh và siết mạng sống em gái đang lọc máu ở Chợ Rẫy. Bách bị đẩy vào thế phải dàn dựng cái chết của một người vô tội, hoặc lật ngược ván cờ và tự nộp mình cho pháp luật.

    Crime thriller hiện thực, đấu trí ba phía giữa giám định viên, kẻ tống tiền, và công an hình sự TP.HCM.
