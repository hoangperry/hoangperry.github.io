    <title id="hdd-title">Ổ cứng nhìn từ trên: tìm track, chờ ô, đọc ô</title>
    <desc id="hdd-description">Sơ đồ 2D minh họa, không theo tỷ lệ và không phải bản vẽ của ổ thật. Một platter có 8 track, track 0 ở ngoài và track 7 ở trong; mỗi track chia 12 ô sector phóng đại, đánh số tăng dần theo thứ tự đi qua đầu đọc. Platter quay theo chiều kim đồng hồ. Tay đòn cứng xoay quanh một trục cố định và mang đầu đọc ở mũi đòn; cuộn dây gắn ở đuôi tay đòn nằm trong từ trường của nam châm cố định (VCM). Các vạch servo chỉ là sơ đồ của dấu vị trí trên đĩa. Ô cần đọc được tô trên đúng một track; phần tô đậm cho biết phần ô đã đi qua đầu đọc. Hình chạy chậm 100 lần: 1 giây màn hình bằng 10 ms mô phỏng. Mỗi lần Chạy là một yêu cầu đọc độc lập.</desc>
    <text x="8" y="20" class="hdd-label hdd-note">Nhìn từ trên · chậm 100×: 1 s = 10 ms</text>
