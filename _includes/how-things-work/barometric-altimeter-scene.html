    <title id="am-title">Từ áp suất tĩnh đến kim đo độ cao</title>
    <desc id="am-description">Sơ đồ tổng hợp một kim, từ âm 600 đến 3600 mét, không quay vòng. Áp suất tĩnh đi vào vỏ, bên ngoài capsule kín (hộp màng) đã hút khí. Thành đàn hồi hồi lại khi áp suất ngoài giảm. Đỉnh capsule nối chốt trong rãnh của đòn cứng, tới khâu cam và hiệu chuẩn lý tưởng, rồi sector ăn khớp ngoài với pinion gắn kim. Núm Ps tác động vào khâu hiệu chuẩn, không đổi áp suất hay capsule. Độ cao mô hình chỉ để đối chiếu ngoài dụng cụ; đây không phải cảm biến độ cao thật. Chuyển vị được phóng đại, hình học răng chỉ minh họa, không mô tả phép tính khí quyển của một thiết bị thương mại.</desc>
