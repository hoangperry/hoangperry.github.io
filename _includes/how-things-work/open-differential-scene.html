  <desc id="od-desc" data-machine-id="od-desc">Sơ đồ nguyên lý tách lớp của bộ vi sai mở đối xứng, không theo tỷ lệ và không phải bản vẽ răng thật. Phía trên: cầu sau nhìn từ sau xe với bánh trái, bán trục và bánh răng bán trục 24 răng, vỏ vi sai và một bánh răng hành tinh (spider) 12 răng đại diện ở phía trên; spider đối diện được lược bỏ. Trục riêng dương của spider hướng từ spider vào tâm vỏ. Giữa: ba mặt số cùng nhìn từ bên phải xe, chiều kim đồng hồ là chiều lăn tiến, cho bánh trái, vỏ vi sai mang spider đi quỹ đạo quanh trục cầu, và bánh phải; một mặt số riêng cho spider tự quay quanh chốt, nhìn dọc trục riêng từ ngoài vào tâm. Dưới: thước tốc độ so với thân xe, vỏ luôn nằm giữa hai bánh; thanh trần bám là giới hạn, không phải mô-men thực, và không dự đoán xe tự do sẽ chạy hay đứng. Cua trái · bán kính tâm cầu 3 m vệt bánh trái 2,25 m · vệt bánh phải 3,75 m</desc>
