<!-- Header -->
<header id="header"{% if page.layout == 'landing' %} class="alt"{% endif %}>
  <h1><a href="{{ site.baseurl }}/index.html">{{ site.title }}</a></h1>
  <nav id="nav">
    <ul>
      <li class="theme-switch">
        <button id="theme-cycle" type="button" aria-label="Switch visual theme">
          <span class="ts-dot" aria-hidden="true"></span><span class="ts-label">security</span>
        </button>
      </li>
      <li><a href="#menu" class="menuToggle"><span>Menu</span></a></li>
    </ul>
  </nav>
</header>
<nav id="menu" aria-label="Primary">
  <button class="menu-close" aria-label="Close menu">x</button>
  <ul>
    <li><a href="{{ "/index.html#greeting" | prepend: site.baseurl }}"{% if page.layout == 'landing' %} aria-current="page" class="is-current"{% endif %}>Home</a></li>{%
    assign sorted_pages = site.pages | sort: 'key','last' %}{%
    for my_page in sorted_pages %}{%
      if my_page.title %}{%
        unless my_page.options contains 'nomenu' %}
    <li><a href="{{ my_page.url | prepend: site.baseurl }}"{% if my_page.url == page.url %} aria-current="page" class="is-current"{% endif %}>{{ my_page.title }}</a></li>{%
        endunless %}{%
      endif %}{%
    endfor %}
    <li><a href="{{ "/feed.xml" | prepend: site.baseurl }}">RSS Feed</a></li>
  </ul>
</nav>
<div class="menu-scrim" hidden></div>
